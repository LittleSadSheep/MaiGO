[project]
name = "maiswitch"
version = "0.1.0"
description = "面向虚拟主播多端生态的 24 小时记忆与生活流中心交换服务"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "mcp>=1.25.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
maiswitch = "maiswitch.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maiswitch"]

[tool.ruff]
include = ["*.py"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC"]
ignore = ["E711", "E501", "ASYNC109", "ASYNC110"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
